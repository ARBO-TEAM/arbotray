name: Release

# Publishing on a tag is what makes a build consumable: the tag is the promise
# that the attached .exe and the committed source are the same thing.
on:
  push:
    tags: ["v*"]
  # A manual run has no tag, so it has to be told which one to refresh —
  # otherwise `github.ref_name` is the branch and it publishes a release
  # called "main".
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Stage the binary
        shell: pwsh
        # Renamed to carry the version: people end up with several copies of
        # this file in Downloads, and `arbotray.exe` twice is a guessing game.
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/arbotray.exe "dist/arbotray-$tag-x86_64.exe"
          Get-ChildItem dist | Format-Table Name, Length

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A tag push makes the release; a manual run only refreshes the binary
        # on an existing one. `--clobber` makes a re-run idempotent.
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $exe = "dist/arbotray-$tag-x86_64.exe"
          if (gh release view $tag 2>$null) {
            gh release upload $tag $exe --clobber
          } else {
            gh release create $tag $exe --title $tag --generate-notes
          }
